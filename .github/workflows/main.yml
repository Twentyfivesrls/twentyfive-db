  build-and-deploy:
    # if: ${{ false }} # this record is to be used to disable the deploy job and use only the sonar-gate job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3.9.0
        with:
          distribution: 'adopt'
          java-version: '17'

      - uses: s4u/maven-settings-action@v2.8.0
        with:
          servers: '[{"id": "github", "username": "${{secrets.SSH_USERNAME}}", "password": "${{secrets.SSH_PASSWORD}}"}]'

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots clean package -DskipTests

      # L'utente deploy può solo lanciare deploy-ci sul server: riceve il pacchetto
      # e lo installa nella destinazione di 'twentyfive-db' scritta in /etc/deploy-ci.conf.
      - name: Deploy sul server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes deploy@80.211.123.141 twentyfive-db < target/twentyfive-db.war
